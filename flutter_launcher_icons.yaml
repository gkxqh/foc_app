# 应用图标生成：一张 1024 透明底源图（assets/icon/icon_src.png）经 tool/gen_icon.dart 处理
# 更新图标后执行：dart run tool/gen_icon.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true # 苹果要求图标无 alpha，透明区域自动转黑底
  adaptive_icon_background: "#000000" # Android 8+ 自适应图标：黑底 + 透明前景（防裁圆切到人物）
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  macos:
    generate: true
